name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
      - name: Show system info
        run: |
          java -version
          which gradle || echo "gradle not in PATH"
          ls -la gradlew 2>/dev/null || echo "no gradlew"
          ls -la gradle/wrapper/ 2>/dev/null || echo "no wrapper dir"
      - name: Build APK
        run: gradle assembleDebug 2>&1 | tail -50
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
